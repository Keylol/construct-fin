services:
  postgres:
    image: postgres:16-alpine
    container_name: construct-v6-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-construct}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-construct_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-construct_v6}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - construct_v6_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-construct} -d ${POSTGRES_DB:-construct_v6}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  construct_v6_pgdata:
    name: construct_v6_pgdata

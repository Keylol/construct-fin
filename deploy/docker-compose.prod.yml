# Production-стек v6 на VPS.
# Запуск: docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d

name: construct-v6

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Ресурсные лимиты (Фаза 1 п.6) — VPS 2 ГБ. При OOM Docker убивает один
    # контейнер (поднимет restart), а не валит весь хост. Сумма лимитов
    # 512+512+384+128 = 1536 МБ, ~512 МБ остаётся хосту + nginx.
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    # Только локально — никакого 5433 наружу. v5.2.1 на :5432 не трогаем.

  api:
    image: ${API_IMAGE:-ghcr.io/keylol/construct-v6-api:latest}
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_ALLOWED_IDS: ${TELEGRAM_ALLOWED_IDS}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH}
    volumes:
      - uploads:/app/data/uploads
    ports:
      - "127.0.0.1:4000:4000"
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5

  web:
    image: ${WEB_IMAGE:-ghcr.io/keylol/construct-v6-web:latest}
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:4000
      INTERNAL_API_URL: http://api:4000
    ports:
      - "127.0.0.1:3000:3000"
    networks: [internal]

  # Бэкап Postgres: pg_dump по расписанию + ротация. Файлы лежат в /backups
  # внутри контейнера, на хосте — в named volume `backups`. Чтобы достать
  # на свой компьютер: `docker cp construct-v6-backup-1:/backups <local>`.
  #
  # SCHEDULE — cron-выражение. По умолчанию 03:17 каждый день (нагрузка на
  # БД минимальная, не пересекается с круглыми часами).
  # KEEP_DAYS=14 — храним две недели daily-снимков.
  # KEEP_WEEKS=8 — храним 8 недельных архивов.
  # KEEP_MONTHS=12 — храним 12 ежемесячных.
  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: '-Z6 --schema=public --blobs'
      SCHEDULE: '${BACKUP_SCHEDULE:-17 3 * * *}'
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-8}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-12}
      HEALTHCHECK_PORT: 8080
    volumes:
      - backups:/backups
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  uploads:
  backups:

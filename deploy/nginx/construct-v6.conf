# /etc/nginx/sites-available/construct-v6.conf
# Production v6 на miniapp.aleksandrantropov.online
# Переиспользует существующий LE-сертификат (SAN покрывает оба имени).

server {
    listen 80;
    server_name miniapp.aleksandrantropov.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name miniapp.aleksandrantropov.online;

    ssl_certificate /etc/letsencrypt/live/constructpc.aleksandrantropov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/constructpc.aleksandrantropov.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # API под /api/v1/<path> → 127.0.0.1:4000/<path>
    location /api/v1/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Всё остальное — Next.js standalone сервер
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

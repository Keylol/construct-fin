# Старый адрес прода — miniapp.aleksandrantropov.online (за Cloudflare).
# С 20.09.2026 приложение живёт только на constructfin.aleksandrantropov.ru
# (deploy/nginx/constructfin.conf). Здесь остаётся страница-затычка: любой
# путь отдаёт deploy/nginx/miniapp-stub/index.html, API отвечает 410, чтобы
# старые вкладки и Mini App не приняли этот хост за рабочий бэкенд.
# На VPS: страница лежит в /var/www/miniapp-stub/, сертификат — прежний certbot.
server {
    listen 80;
    server_name miniapp.aleksandrantropov.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name miniapp.aleksandrantropov.online;

    ssl_certificate /etc/letsencrypt/live/miniapp.aleksandrantropov.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miniapp.aleksandrantropov.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/miniapp-stub;

    location /api/ {
        return 410;
    }

    location / {
        try_files /index.html =404;
    }
}

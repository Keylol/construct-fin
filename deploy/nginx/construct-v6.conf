# /etc/nginx/sites-available/construct-v6.conf
# Production v6 на miniapp.aleksandrantropov.online
# Переиспользует существующий LE-сертификат (SAN покрывает оба имени).

server {
    listen 80;
    server_name miniapp.aleksandrantropov.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name miniapp.aleksandrantropov.online;

    # ⚠️ L6 (наблюдаемость/эксплуатация) — ДЕЙСТВИЕ НА VPS, не в этом файле:
    # cert — это SAN на constructpc.aleksandrantropov.ru (SAN покрывает и miniapp),
    # но домен constructpc МЁРТВ (DNS не резолвится). При авто-продлении Let's
    # Encrypt проверка challenge для constructpc упадёт → НЕ продлится ВЕСЬ cert →
    # сертификат miniapp истечёт → Mini App отвалится по TLS. Фикс (на VPS, руками):
    #   certbot certonly -d miniapp.aleksandrantropov.online   # выпустить отдельный
    #   cert только на живой домен, затем заменить ДВА пути ниже на
    #   /etc/letsencrypt/live/miniapp.aleksandrantropov.online/{fullchain,privkey}.pem,
    #   `nginx -t && systemctl reload nginx`. Проверить срок: `certbot certificates`.
    # Путь НЕ меняем в репо, пока cert на живой домен не выпущен на VPS (иначе
    # nginx -t упадёт на несуществующем файле). См. также deploy/backup-restore.md.
    ssl_certificate /etc/letsencrypt/live/constructpc.aleksandrantropov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/constructpc.aleksandrantropov.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # --- Security headers (Фаза 1 п.5) ---
    # На уровне server → применяются к обеим location ниже (ни одна из них не
    # объявляет собственный add_header, иначе серверные НЕ наследуются — nginx
    # заменяет, а не сливает). `always` — слать и на ответах-ошибках (4xx/5xx).
    # Эти строки активируются на VPS: cp в /etc/nginx/sites-available →
    # `nginx -t` → `systemctl reload nginx` (деплой-пайплайн nginx НЕ катит).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Mini App грузится в iframe Telegram Web/Desktop. CSP frame-ancestors имеет
    # приоритет над X-Frame-Options в современных браузерах (CSP2) — Telegram
    # продолжит грузить Mini App, а XFO остаётся fallback'ом для древних движков
    # (defense-in-depth). Проверить в Telegram Web/Desktop после reload.
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.telegram.org https://telegram.org" always;

    # Полноценный CSP (default-src/script-src/…) — ОТДЕЛЬНЫМ шагом и ТОЛЬКО
    # после прогона в браузере через Report-Only на VPS: Next.js инлайнит
    # скрипты/стили и грузит Telegram SDK с telegram.org, строгий CSP их ломает.
    # Шаблон для проверки (НЕ включать до browser-теста, ослабить по отчётам):
    # add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self' https://*.telegram.org https://telegram.org" always;

    # API под /api/v1/<path> → 127.0.0.1:4000/<path>
    location /api/v1/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Всё остальное — Next.js standalone сервер
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

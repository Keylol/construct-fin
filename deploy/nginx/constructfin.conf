# /etc/nginx/sites-available/constructfin.conf
# Прямой адрес БЕЗ Cloudflare: constructfin.aleksandrantropov.ru → этот же VPS,
# те же контейнеры api/web (см. construct-v6.conf). Добавлен 15.09.2026: часть
# провайдеров РФ режет диапазоны Cloudflare — miniapp.aleksandrantropov.online
# у них не открывается без VPN, этот адрес — обходной путь на живом рос. сервере.
# Топология и статус — docs/deploy.md «Два адреса».
#
# Домен aleksandrantropov.ru — reg.ru, NS reg.ru (без Cloudflare), A-запись
# constructfin → 195.133.1.13 заведена в личном кабинете reg.ru.
#
# Откат: rm /etc/nginx/sites-enabled/constructfin.conf && nginx -t && systemctl reload nginx
#        certbot delete --cert-name constructfin.aleksandrantropov.ru
# miniapp это не затрагивает — отдельный server_name, отдельный сертификат.

server {
    listen 80;
    server_name constructfin.aleksandrantropov.ru;

    # Certbot webroot — challenge должен ходить по HTTP даже после того, как
    # ниже появится редирект на https (иначе продление сломается так же, как
    # раньше ломало общий cert на constructpc, см. construct-v6.conf).
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name constructfin.aleksandrantropov.ru;

    ssl_certificate /etc/letsencrypt/live/constructfin.aleksandrantropov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/constructfin.aleksandrantropov.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # Те же заголовки, что на miniapp в этом репо (construct-v6.conf) — держать
    # оба файла в одном состоянии при правках. ⚠️ На проде у miniapp сейчас эти
    # заголовки НЕ отданы (certbot --nginx переписал файл без них) — см. чип
    # «Sync live miniapp nginx with repo (security headers, cert path)».
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.telegram.org https://telegram.org" always;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

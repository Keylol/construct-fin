name: Build & Deploy v6

on:
  push:
    branches: [v6]
  workflow_dispatch:

concurrency:
  group: deploy-v6
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Docker tags must be lowercase; github.repository_owner для Keylol даёт "Keylol".
  IMAGE_API: ghcr.io/keylol/construct-v6-api
  IMAGE_WEB: ghcr.io/keylol/construct-v6-web

jobs:
  # Тест-гейт: deploy не запускается, пока CI не прошёл зелёным. Вызываем
  # ci.yml как reusable workflow (workflow_call) — на том же коммите v6, без
  # зависимости от дефолтной ветки (важно: дефолтная ветка репо — main, не v6,
  # поэтому workflow_run здесь не сработал бы).
  ci-gate:
    name: CI must pass
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & push images to GHCR
    needs: ci-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha-tag: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=ConstructOperate_bot
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 195.133.1.13 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull, restart, migrate (с авто-откатом, E2)
        run: |
          ssh -i ~/.ssh/deploy_key root@195.133.1.13 << 'REMOTE'
            cd /srv/construct-v6
            DC="docker compose -f deploy/docker-compose.prod.yml --env-file .env.production"

            # E2: запоминаем ОБРАЗЫ текущей рабочей версии ДО pull (immutable image ID,
            # не :latest — его перетрёт pull). При нездоровье откатываемся на них.
            # Миграции аддитивны (правило проекта) → старый образ совместим с новой
            # схемой, поэтому откат ТОЛЬКО образа, БД не трогаем.
            PREV_API=$(docker inspect --format '{{.Image}}' construct-v6-api-1 2>/dev/null || echo "")
            PREV_WEB=$(docker inspect --format '{{.Image}}' construct-v6-web-1 2>/dev/null || echo "")
            echo "prev images: api=$PREV_API web=$PREV_WEB"

            api_healthy() {
              for i in $(seq 1 30); do
                s=$(docker inspect --format '{{.State.Health.Status}}' construct-v6-api-1 2>/dev/null || echo "?")
                [ "$s" = "healthy" ] && { echo "api healthy after ${i}*4s"; return 0; }
                sleep 4
              done
              return 1
            }

            # L3: web тоже в health-gate отката. Без этого сломанный web-образ
            # (api жив, но фронт не поднялся) уезжал в прод и откатом не покрывался.
            # Требует healthcheck у web-сервиса в compose (GET /login → 200).
            web_healthy() {
              for i in $(seq 1 30); do
                s=$(docker inspect --format '{{.State.Health.Status}}' construct-v6-web-1 2>/dev/null || echo "?")
                [ "$s" = "healthy" ] && { echo "web healthy after ${i}*4s"; return 0; }
                sleep 4
              done
              return 1
            }

            rollback() {
              echo "::error::Деплой нездоров ($1) — откат на предыдущие образы"
              if [ -n "$PREV_API" ] && [ -n "$PREV_WEB" ]; then
                docker tag "$PREV_API" ghcr.io/keylol/construct-v6-api:rollback
                docker tag "$PREV_WEB" ghcr.io/keylol/construct-v6-web:rollback
                API_IMAGE=ghcr.io/keylol/construct-v6-api:rollback \
                WEB_IMAGE=ghcr.io/keylol/construct-v6-web:rollback \
                  $DC up -d api web
                echo "--- статус после отката ---"; $DC ps --format "{{.Name}} {{.Status}}"
                api_healthy && echo "откат успешен (api healthy)" || echo "::error::откат не вернул health — ручной разбор"
              else
                echo "::error::нет сохранённых предыдущих образов — ручной разбор"
              fi
              exit 1
            }

            set -e
            echo "--- pull ---"; $DC pull
            set +e

            # L1: migrate ДО up -d. Раньше был порядок up -d → migrate, из-за чего
            # НОВЫЙ код запускался на СТАРОЙ схеме и до миграции отдавал 4xx (join к
            # ещё-несуществующей таблице — уже ловили на F0/schedule/write_off).
            # Файлы миграций вшиты в ОБРАЗ, поэтому старый работающий контейнер их не
            # содержит — применяем ОДНОРАЗОВЫМ контейнером нового образа (docker
            # compose run --rm --no-deps: postgres уже поднят, порты не публикуются,
            # конфликта с работающим api:4000 нет). Пока идёт миграция, СТАРЫЙ код ещё
            # обслуживает трафик на новой (аддитивной) схеме — правило проекта:
            # миграции аддитивны, старый код их терпит. Затем up -d перекатывает код
            # на уже мигрированную схему → окна «новый код на старой схеме» больше нет.

            echo "--- pre-migrate snapshot ---"
            # ⚠️ </dev/null ОБЯЗАТЕЛЕН: exec -T без редиректа отдаёт процессу stdin
            # SSH-heredoc → /backup.sh съедал остаток heredoc (включая migrate).
            # Провал ДО переключения кода → просто abort: прод остаётся на старой
            # рабочей версии, образы не тронуты, откатывать нечего.
            $DC exec -T backup /backup.sh </dev/null \
              || { echo "::error::снапшот БД упал (код НЕ переключён, прод на старой версии)"; exit 1; }

            echo "--- migrate (одноразовый контейнер нового образа, до up -d) ---"
            $DC run --rm --no-deps -T api sh -c "cd /app/node_modules/@construct/db && npx prisma migrate deploy" </dev/null \
              || { echo "::error::миграция упала (код НЕ переключён, прод на старой версии; неуспешная миграция транзакционно откачена, снапшот снят выше)"; exit 1; }

            echo "--- up -d (новый код на уже мигрированной схеме) ---"; $DC up -d

            echo "--- wait api healthy ---"
            api_healthy || rollback "api не стал healthy"
            echo "--- wait web healthy (L3) ---"
            web_healthy || rollback "web не стал healthy"

            echo "--- health re-check (проба самой БД через /health) ---"
            # Тот же проб, что docker healthcheck (node гарантированно в образе).
            # С honest-health (L2, PR 4.1): /health=503 при мёртвой БД → ловит и
            # отказ БД, и код, не обслуживающий /health на мигрированной схеме.
            $DC exec -T api node -e "require('http').get('http://localhost:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" </dev/null \
              || rollback "/health не 200 после деплоя"

            echo "--- final status ---"; $DC ps --format "{{.Name}} {{.Status}}"
            echo "--- prune dangling ---"; docker image prune -f >/dev/null
          REMOTE

      - name: Smoke-test external
        run: |
          curl -fsS https://miniapp.aleksandrantropov.online/api/v1/health
          echo
          curl -fsS -o /dev/null -w "login: %{http_code}\n" https://miniapp.aleksandrantropov.online/login

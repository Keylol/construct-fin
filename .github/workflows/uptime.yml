name: Uptime

# Внешняя проверка прода раз в 15 минут — из GitHub, а не с самого VPS:
# падение из-за неоплаты хостинга (29.08) или мёртвого nginx видно только
# снаружи. Сообщение в Telegram один раз при падении и один раз при
# восстановлении (состояние — заключение предыдущего прогона).
# Ручной запуск с галкой test шлёт пробное сообщение — проверить токен и chat_id.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Прислать пробное сообщение в Telegram'
        type: boolean
        default: false

concurrency: uptime

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Previous conclusion
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list -R "$GITHUB_REPOSITORY" --workflow uptime.yml --status completed -L 1 \
            --json conclusion --jq '.[0].conclusion // "none"')
          echo "conclusion=$prev" >> "$GITHUB_OUTPUT"

      - name: Test message
        if: github.event_name == 'workflow_dispatch' && inputs.test
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ vars.ALERT_TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=🔔 Проверка алертов Construct: канал работает." | grep -q '"ok":true'

      - name: Probe prod
        id: probe
        run: |
          code=000
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
              https://miniapp.aleksandrantropov.online/api/v1/health || echo 000)
            [ "$code" = "200" ] && break
            sleep 20
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = "200" ]

      - name: Alert down
        if: failure() && steps.prev.outputs.conclusion != 'failure'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ vars.ALERT_TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=⛔ Construct не отвечает: /api/v1/health → ${{ steps.probe.outputs.code }} после трёх попыток.
          https://miniapp.aleksandrantropov.online
          Если сайт 522/таймаут и SSH молчит — сначала проверить оплату VPS." >/dev/null

      - name: Alert recovered
        if: success() && steps.prev.outputs.conclusion == 'failure'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ vars.ALERT_TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=✅ Construct снова отвечает (health 200)." >/dev/null

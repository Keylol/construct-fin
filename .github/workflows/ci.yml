name: CI

on:
  pull_request:
    branches: [v6]
  # Вызывается как тест-гейт из deploy.yml (reusable workflow). На push в v6
  # отдельно НЕ запускается — там CI гоняется как gate внутри деплоя, чтобы
  # не дублировать прогон. PR в v6 по-прежнему проверяется здесь.
  workflow_call:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: construct
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: construct_v6_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construct"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://construct:ci_password@localhost:5432/construct_v6_ci?schema=public
      # Отдельная БД под деньги-интеграцию: тесты TRUNCATE'ят её между собой,
      # держим в стороне от основной CI-БД. Харнес читает TEST_DATABASE_URL.
      TEST_DATABASE_URL: postgresql://construct:ci_password@localhost:5432/construct_v6_test?schema=public
      JWT_SECRET: ci_secret_at_least_16_chars_long
      TELEGRAM_BOT_TOKEN: 000000:CI_DUMMY_TOKEN
      TELEGRAM_BOT_USERNAME: CIBotMock
      TELEGRAM_ALLOWED_IDS: ''
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Guard partial-unique индексы (drift)
        # Partial-unique индексы (..._active_key, WHERE deletedAt IS NULL) заведены
        # сырым SQL и НЕ описаны в schema.prisma, поэтому `prisma migrate dev` без
        # --create-only генерит их DROP (Prisma видит drift). Такой DROP снимает
        # защиту БД от двойного импорта и дублей номеров/SKU после soft-delete.
        # Ловим его в любой миграции и валим CI (см. docs/audit-2026-06-16.md, F1).
        run: |
          if grep -rniE 'DROP[[:space:]]+INDEX[^;]*_active_key' packages/db/prisma/migrations; then
            echo "::error::Миграция дропает partial-unique индекс (..._active_key). Убери DROP INDEX из SQL: migrate dev --create-only, затем удали строку DROP."
            exit 1
          fi
          echo "OK: partial-unique индексы (..._active_key) не дропаются"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @construct/db exec prisma generate

      - name: Build workspace packages
        # apps/api и apps/web резолвят @construct/shared и @construct/db через
        # dist/ (CommonJS). Без сборки пакетов в dist typecheck падает с
        # TS2307 "Cannot find module '@construct/shared'".
        run: pnpm --filter @construct/shared --filter @construct/db run build

      - name: Apply migrations
        run: pnpm --filter @construct/db exec prisma migrate deploy

      - name: Prepare integration test DB
        # Деньги-интеграция гоняется против отдельной construct_v6_test.
        # psql предустановлен на ubuntu-latest; БД создаём через основное
        # подключение, затем накатываем те же миграции.
        run: |
          PGPASSWORD=ci_password psql -h localhost -U construct -d construct_v6_ci \
            -c "CREATE DATABASE construct_v6_test"
          DATABASE_URL="$TEST_DATABASE_URL" \
            pnpm --filter @construct/db exec prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint
        continue-on-error: true # пока без ESLint для api

      - name: Test
        run: pnpm test

      - name: Integration tests (money flows)
        # Самый ценный сьют: закупка→склад→WAVG, finalize→COGS, сторно,
        # синхронизация оплаты, атомарность. Раньше в CI не гонялся.
        run: pnpm --filter @construct/api run test:integration

      - name: Build
        run: pnpm build

  # L11 (supply chain): скан уязвимостей зависимостей (Trivy). Отдельная job —
  # гоняется параллельно тестам. Сейчас REPORT-ONLY (exit-code 0): печатает таблицу
  # HIGH/CRITICAL fixable в лог, деплой НЕ блокирует. Чтобы сделать гейтом (упасть
  # на найденных CVE) — поменять exit-code на '1'. ignore-unfixed: не шуметь по
  # уязвимостям без доступного апдейта (base-alpine и пр.).
  security-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (deps CVEs)
        # Пин по commit SHA (не по плавающему тегу) — supply-chain hardening и для
        # самого экшена. Бампить осознанно. SHA = tag v0.36.0.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table
